name: DSIA CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test_proyecto_i:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto_i
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests Proyecto I
        run: python -m pytest -q --cov=ventas_app --cov=emt_app --cov-report=term-missing --cov-fail-under=60

  test_proyecto_ii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r proyecto_ii/requirements.txt
      - name: Tests Proyecto II (mock, sin Internet)
        run: python -m pytest -q -c pytest.ini proyecto_ii/tests
