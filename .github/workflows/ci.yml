
name: Proyecto I CI

on:
  push:
    branches:
      - main
      - proyectoi/parteA
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyecto_i

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests and coverage
        run: |
          python -m pytest -q --cov=ventas_app --cov-report=term-missing --cov-fail-under=60
